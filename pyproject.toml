[project]
name = "ppt-design-engine"
version = "0.1.0"
description = "A local-first design intelligence and PPTX rendering engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "python-pptx>=0.6.23",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "jsonschema>=4.22"]

[project.scripts]
ppt-engine = "ppt_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppt_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

# Temporary, file-scoped debt register for compact legacy modules.
# New modules remain subject to the full E/F rules; do not broaden these ignores.
[tool.ruff.lint.per-file-ignores]
"src/ppt_engine/advanced_critic.py" = ["E701", "E702", "E741"]
"src/ppt_engine/production.py" = ["E701"]
"src/ppt_engine/repair_validation.py" = ["E731"]
"src/ppt_engine/reverse_engineering.py" = ["E701", "E702"]
"src/ppt_engine/visual_intelligence.py" = ["E401", "E701", "E702"]
