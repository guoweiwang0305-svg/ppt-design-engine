<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GCL × AIA 专家评审台</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1b2430;--line:#354253;--text:#edf2f8;--muted:#a8b5c5;--accent:#d9ad58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui}button,input,select,textarea{font:inherit}button{padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:#29384a;color:var(--text);cursor:pointer}button:disabled{opacity:.5}.app{display:grid;grid-template-columns:260px 1fr 340px;height:100vh}aside{overflow:auto;background:var(--panel);padding:14px}aside:first-child{border-right:1px solid var(--line)}aside:last-child{border-left:1px solid var(--line)}header{padding:12px 16px;background:#18212c;display:flex;justify-content:space-between;gap:8px;align-items:center}.main{display:flex;flex-direction:column;min-width:0}.stage{flex:1;min-height:0;display:grid;place-items:center;padding:16px}.stage img{max-width:100%;max-height:100%;object-fit:contain}.bottom{padding:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.muted{color:var(--muted)}.field{width:100%;padding:8px;background:#101923;color:var(--text);border:1px solid var(--line);border-radius:6px;margin:4px 0}.case{padding:9px;border-radius:7px;margin:4px 0;cursor:pointer}.case.active{background:#3a3325;outline:1px solid var(--accent)}.stats{display:flex;gap:12px;margin:12px 0}.stats b{font-size:20px;display:block}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.checks label{font-size:12px}.section{border-bottom:1px solid var(--line);padding:12px 0}.section h3{font-size:13px;color:var(--accent);margin:0 0 8px}.finding,.card{background:#111a24;padding:9px;border-radius:7px;margin:7px 0}.row{display:flex;gap:7px;flex-wrap:wrap}.row button{flex:1}.primary{background:#a77b32}.hint{font-size:12px;color:var(--muted)}textarea{min-height:80px}.pill{color:var(--accent)}@media(max-width:1050px){.app{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:700px){.app{display:block;height:auto}.side{height:230px}.main{height:60vh}.right{display:block}}
</style>
<header><b>视觉专家评审台 <span class="pill">GCL 16 + AIA 19</span></b><div class="row"><button id="export">导出标注</button><button id="import">导入</button><button id="runAll">同一模型评测 35 页</button><button id="config">模型设置</button></div></header>
<div class="app"><aside class="side"><div class="muted">35 页 · 专家独立标注 → 模型盲测</div><div class="stats"><div><b id="done">0</b><span class="muted">已评审</span></div><div><b id="pending">35</b><span class="muted">待评审</span></div></div><input id="search" class="field" placeholder="搜索页面或类型"><select id="family" class="field"><option value="all">全部来源</option><option>GCL</option><option>AIA</option></select><div id="pages"></div></aside>
<main class="main"><div class="stage"><img id="image" alt="参考页"></div><div class="bottom"><div><b id="name">加载中</b><div id="meta" class="muted"></div></div><div class="row"><button id="prev">上一页</button><button id="next">下一页</button></div></div></main>
<aside class="right"><div class="section"><h3>① 专家独立标注</h3><div class="hint">先完成专家判断，再运行模型，避免锚定效应。</div><div id="checks" class="checks"></div></div><div class="section"><h3>② 专家记录</h3><input id="reviewer" class="field" placeholder="评审人 / 专家代号"><select id="severity" class="field"><option>minor</option><option>major</option><option>blocker</option></select><textarea id="notes" class="field" placeholder="证据、位置、影响、建议"></textarea><button class="primary" id="save">保存本页标注</button></div><div class="section"><h3>③ 视觉模型诊断</h3><button class="primary" id="runOne">运行当前页</button><div id="modelState" class="hint">模型尚未运行</div><div id="findings"></div></div><div class="section"><h3>④ FP / FN 统计</h3><div id="metrics" class="hint">完成人工标注与模型运行后生成</div><button id="exportMetrics">导出统计 JSON</button></div></aside></div>
<script>
const TAX=['composition_imbalance','weak_visual_hierarchy','chart_encoding_unclear','chart_label_unreadable','image_crop_poor','information_overcrowded','style_inconsistent','alignment_inconsistent','contrast_insufficient','text_overflow','decorative_noise','narrative_focus_unclear'];
const LABEL=['构图失衡','视觉层级不清','图表表达不清','图表标签难读','图片裁切不当','信息拥挤','风格不一致','对齐不一致','对比度不足','文字溢出','装饰噪声','叙事焦点不清'];
const KEY='pde_gcl_aia_review_2026_11_19_v1';let manifest,idx=0,labels={},models={},endpoint=localStorage.getItem('visionEndpoint')||'',identity=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){manifest=await (await fetch('manifest.json')).json();manifest.cases.forEach(c=>labels[c.case_id]={review_status:'pending_expert_review',expected_issue_codes:[],reviewer_id:'',reviewer_notes:'',severity:'minor'});let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.dataset_id===manifest.dataset_id){labels={...labels,...saved.labels};models=saved.models||{};}TAX.forEach((x,i)=>$('checks').insertAdjacentHTML('beforeend',`<label><input type="checkbox" value="${x}"> ${LABEL[i]}</label>`));render();select(0);}
function persist(){localStorage.setItem(KEY,JSON.stringify({dataset_id:manifest.dataset_id,labels,models,updated_at:new Date().toISOString()}));renderMetrics();}
function select(i){idx=Math.max(0,Math.min(i,manifest.cases.length-1));let c=manifest.cases[idx],a=labels[c.case_id];$('image').src='visual_test_set/'+c.image_file;$('name').textContent=c.case_id;$('meta').textContent=c.source_family+' · '+c.slide_type+' · '+(idx+1)+'/35';$('reviewer').value=a.reviewer_id||'';$('notes').value=a.reviewer_notes||'';$('severity').value=a.severity||'minor';document.querySelectorAll('#checks input').forEach(x=>x.checked=(a.expected_issue_codes||[]).includes(x.value));renderModel();render();}
function render(){let arr=manifest.cases.filter(c=>($('family').value==='all'||c.source_family===$('family').value)&&(`${c.case_id} ${c.slide_type}`.toLowerCase().includes($('search').value.toLowerCase())));$('pages').innerHTML=arr.map(c=>`<div class="case ${manifest.cases.indexOf(c)===idx?'active':''}" data-id="${c.case_id}"><b>${c.case_id}</b><div class="hint">${c.slide_type} · ${labels[c.case_id].review_status==='reviewed'?'已评审':'待评审'}</div></div>`).join('');document.querySelectorAll('.case').forEach(el=>el.onclick=()=>select(manifest.cases.findIndex(c=>c.case_id===el.dataset.id)));let n=Object.values(labels).filter(a=>a.review_status==='reviewed').length;$('done').textContent=n;$('pending').textContent=35-n;}
function save(){let c=manifest.cases[idx],a=labels[c.case_id];a.expected_issue_codes=[...document.querySelectorAll('#checks input:checked')].map(x=>x.value);a.reviewer_id=$('reviewer').value;a.reviewer_notes=$('notes').value;a.severity=$('severity').value;a.review_status='reviewed';persist();render();$('modelState').textContent='专家标签已保存。请先完成 GCL 16 页，再评审 AIA 19 页。';}
function renderModel(){let r=models[manifest.cases[idx].case_id];$('findings').innerHTML='';if(!r){$('modelState').textContent='模型尚未运行';return;}$('modelState').textContent=(r.provider||'?')+' / '+(r.model||'?')+' · '+(r.findings||[]).length+' 项';(r.findings||[]).forEach(f=>$('findings').insertAdjacentHTML('beforeend',`<div class="finding"><b>${esc(f.code)}</b><div class="hint">${esc(f.severity)} · ${Math.round((f.confidence||0)*100)}%</div><div>${esc(f.rationale)}</div><div class="hint">${esc(f.recommendation)}</div></div>`));}
async function run(c){let img=await fetch('visual_test_set/'+c.image_file);if(!img.ok)throw Error('image missing');let blob=await img.blob(),data=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});let resp=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:c.case_id,source_family:c.source_family,slide_type:c.slide_type,image_mime_type:'image/png',image_data_base64:data,context:{instruction:'Inspect the complete slide image. Return only evidence-grounded findings using the fixed issue taxonomy. Keep model, prompt and thresholds identical for the full benchmark.',style_reference:c.source_family==='GCL'?'GCL corporate style: restrained red/white/charcoal, typography, composition, hierarchy and consistency.':'AIA information organization only: narrative, hierarchy, relationship diagrams, chart clarity and density. Not a GCL brand reference.'}})});if(!resp.ok)throw Error('HTTP '+resp.status);return await resp.json();}
$('save').onclick=save;$('prev').onclick=()=>select(idx-1);$('next').onclick=()=>select(idx+1);$('search').oninput=render;$('family').onchange=render;
$('config').onclick=()=>{let x=prompt('兼容 VisionCritique 的 POST 服务地址',endpoint);if(x!==null){endpoint=x.trim();localStorage.setItem('visionEndpoint',endpoint);}};
$('runOne').onclick=async()=>{if(!endpoint)return alert('请先配置模型服务');$('modelState').textContent='运行中…';try{let c=manifest.cases[idx],r=await run(c);models[c.case_id]=r;persist();renderModel();}catch(e){$('modelState').textContent='失败：'+e.message;}};
$('runAll').onclick=async()=>{if(!endpoint)return alert('请先配置模型服务');let reviewed=Object.values(labels).filter(a=>a.review_status==='reviewed').length;if(reviewed!==35)return alert('请先完成 GCL 16 页和 AIA 19 页的专家独立评审（当前 '+reviewed+'/35），再启动模型盲测。');if(!confirm('用同一服务依次评测全部 35 页？'))return;let done=0,errors=[];identity=null;$('runAll').disabled=true;for(let c of manifest.cases){$('modelState').textContent='批量评测 '+(done+errors.length+1)+'/35 · '+c.case_id;try{let r=await run(c),id=(r.provider||'unknown')+'/'+(r.model||'unspecified');if(identity&&id!==identity)throw Error('模型身份发生变化：'+id);identity=identity||id;models[c.case_id]=r;done++;persist();}catch(e){errors.push({case_id:c.case_id,error:e.message});}}$('runAll').disabled=false;renderModel();$('modelState').textContent='批量完成：成功 '+done+'/35，失败 '+errors.length+'；模型 '+(identity||'未确认');if(errors.length)download({errors},'batch-errors.json');};
function metrics(){let cases=manifest.cases.filter(c=>labels[c.case_id].review_status==='reviewed'&&models[c.case_id]?.findings),out=[];for(let family of ['GCL','AIA'])for(let type of [...new Set(cases.filter(c=>c.source_family===family).map(c=>c.slide_type))]){let tp=0,fp=0,fn=0,subset=cases.filter(c=>c.source_family===family&&c.slide_type===type);for(let c of subset){let truth=new Set(labels[c.case_id].expected_issue_codes),pred=new Set((models[c.case_id].findings||[]).map(f=>f.code));for(let code of TAX){if(truth.has(code)&&pred.has(code))tp++;else if(!truth.has(code)&&pred.has(code))fp++;else if(truth.has(code)&&!pred.has(code))fn++;}}let p=tp+fp?tp/(tp+fp):0,r=tp+fn?tp/(tp+fn):0;out.push({family,type,pages:subset.length,tp,fp,fn,precision:p,recall:r,f1:p+r?2*p*r/(p+r):0});}return {dataset_id:manifest.dataset_id,reviewed_pages:Object.values(labels).filter(a=>a.review_status==='reviewed').length,compared_pages:cases.length,by_family_and_type:out};}
function renderMetrics(){if(!manifest)return;let m=metrics(),fp=[...m.by_family_and_type].sort((a,b)=>b.fp-a.fp).slice(0,3),fn=[...m.by_family_and_type].sort((a,b)=>b.fn-a.fn).slice(0,3);$('metrics').innerHTML='可比较 '+m.compared_pages+'/35 页<br>FP 高发：'+fp.map(x=>x.family+'/'+x.type+' ('+x.fp+')').join('；')+'<br>FN 高发：'+fn.map(x=>x.family+'/'+x.type+' ('+x.fn+')').join('；')+'<br><small>仅统计已完成专家标注且模型成功返回的页面。</small>';window.latestMetrics=m;}
function download(o,n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
$('export').onclick=()=>download({...manifest,cases:manifest.cases.map(c=>({...c,...labels[c.case_id],observed_issue_codes:(models[c.case_id]?.findings||[]).map(f=>f.code).filter(Boolean)})),model_results:models},'expert-review.json');$('exportMetrics').onclick=()=>download(metrics(),'fp-fn-metrics.json');$('import').onclick=()=>{let f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{let d=JSON.parse(await f.files[0].text());if(d.cases)d.cases.forEach(c=>{if(labels[c.case_id])labels[c.case_id]={...labels[c.case_id],...c}});models={...models,...(d.model_results||{})};persist();render();};f.click();};
init();
</script></html>
